name: Publish v1.1.0 source branch

on:
  push:
    branches:
      - agent/v1.1.0
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-v1.1.0/chunk-* > /tmp/project-cognition-v1.1.0.zip.b64
          base64 --decode /tmp/project-cognition-v1.1.0.zip.b64 > /tmp/project-cognition-v1.1.0.zip
          echo "2bac15b52950fa6350f7bfb74d5b020edab74f8dcf2d4cc413e7b25c61d7ab11  /tmp/project-cognition-v1.1.0.zip" | sha256sum --check --strict
          rm -rf /tmp/project-cognition-v1.1.0
          mkdir -p /tmp/project-cognition-v1.1.0
          unzip -q /tmp/project-cognition-v1.1.0.zip -d /tmp/project-cognition-v1.1.0
          rsync -a /tmp/project-cognition-v1.1.0/project-cognition/ ./

      - name: Run tests
        run: python tests/run_tests.py

      - name: Build release packages
        run: python tools/build_release.py --output dist

      - name: Commit release source and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap-v1.1.0 .github/workflows/publish-v1.1.0.yml
          git add -A
          git commit -m "Release Project Cognition v1.1.0"
          git push origin HEAD:agent/v1.1.0
