name: Bootstrap initial release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/project-cognition-source.zip.b64
          base64 --decode /tmp/project-cognition-source.zip.b64 > /tmp/project-cognition-source.zip
          echo "d05a60d6cbc16585032ebc1573c461c94d037182e805b0b5f251030004b7b322  /tmp/project-cognition-source.zip" | sha256sum --check --strict
          mkdir -p /tmp/project-cognition-source
          unzip -q /tmp/project-cognition-source.zip -d /tmp/project-cognition-source
          rsync -a /tmp/project-cognition-source/project-cognition/ ./

      - name: Run tests
        run: python tests/run_tests.py

      - name: Build release packages
        run: python tools/build_release.py --output dist

      - name: Commit public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes .gitignore CHANGELOG.md INSTALL.zh-CN.md LICENSE README.md README.zh-CN.md SKILL.md VERSION agents assets packaging references scripts tests tools
          git commit -m "Publish Project Cognition v1.0.0"
          git push origin HEAD:main

      - name: Create version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(tr -d '\r\n' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git tag -a "$TAG" -m "Project Cognition $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Project Cognition $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --title "$TITLE" --generate-notes
          fi

      - name: Remove temporary bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap
          git commit -m "Remove bootstrap payload"
          git push origin HEAD:main
