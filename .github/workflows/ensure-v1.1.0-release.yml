name: Ensure v1.1.0 release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ensure-v1.1.0-release.yml

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and build
        run: |
          python tests/run_tests.py
          python tools/build_release.py --output dist

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --title "Project Cognition $TAG" --generate-notes
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ensure-v1.1.0-release.yml
          git commit -m "Remove v1.1.0 release verifier"
          git push origin HEAD:main
